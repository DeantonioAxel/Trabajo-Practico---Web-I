<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion Empresas - X Group Education</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/inscripcionParaEmpresas.css">
    <link rel="icon" href="../images/logo X Group.png" type="imagen/png">
</head>

<body>
    <header class="headerC" id="headerC">
        <div class="logo">
            <a href="../index.html"> <img src="../images/logo X Group.png" alt="Logo de la pagina"> </a>
            <a class="titulologo" href="../index.html">
                <h1>X Group Education</h1>
            </a>
        </div>
        <div class="search-cursos">
            <input list="cursos" id="traveling-web" name="traveling-web">
            <datalist id="cursos">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python">
                <option value="Photoshop">
                <option value="Java">
                <option value="Programacion C">
                <option value="Chat Gpt">
                <option value="Blender Diseño 3d">
                <option value="Canva">
                <option value="Ia: Generacion de prompts">
                <option value="Illustrator">
                <option value="Inteligencia Artificial">
                <option value="Marketing Digital">
            </datalist>
        </div>
        <div class="right-side js-btns-header">
        </div>
    </header>
    <hr class="headerline">
    <nav>
        <ul class="nav-links js-nav">
        </ul>
    </nav>
    <hr class="headerline">
    
    <main>
        <div class="sidebar-carrito">
        </div>
        <section>
            <h1 class="inscripcion">Inscripcion</h1>
            <form action="Inscripcion">
                <div class="empresa_curso">
                    <label for="company_name">
                        <input type="text" id="company_name" name="company_name" placeholder="Nombre de la empresa"
                            required>
                    </label>
                    <label for="Seleccion_curso">Selecciona el curso:
                        <select id="Seleccion_curso" name="Seleccion_curso" required>
                            <option value="" disabled selected>Seleccionar curso</option>

                        </select>
                    </label>
                </div>
                <div class="contenedorListadoAlumnos">
                    <div class="datos_alumno">
                        <label for="last_name">
                            <input type="text" id="last_name" name="last_name" placeholder="Apellido" required>
                        </label>
                        <label for="Name">
                            <input type="text" id="Name" name="Name" placeholder="Nombre" required>
                        </label>
                        <label for="DNI">
                            <input type="text" id="DNI" name="DNI" placeholder="DNI" max="99999999" required>
                        </label>
                        <button type="button" class="boton_circular" id="borrar-alumno">-</button>
                    </div>
                </div>
                <div class="agregar_persona">
                    <p>Agregar persona <button type="button" class="boton_circular" id="agregar-alumno">+</button></p>
                </div>
                <div class="datos_confirmacion">
                    <p id="Importe_acumulado">$000.-</p>
                    <button type="submit" class="boton_inscripcion">Confirmar inscripcion</button>
                </div>
            </form>
            <dialog>
                <h2> ~ Muchas gracias ~ </h2>
                <h3 class="contenedor_empresa_dialog"></h3>
                <h3>El listado de alumnos y el link de pago seran enviados por email</h3>
                <button id="js-CloseDialog">Cerrar</button>
            </dialog>
        </section>
    </main>

    <footer class="footer js-footer"></footer>


    <script type="module" src="../js/inscripcionEmpresas.js"></script>

</body>

</html>
