<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion - X Group Education</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="icon" href="../images/logo X Group.png" type="imagen/png">
</head>

<body>
    <header class="headerC" id="headerC">
        <div class="logo">
            <a href="../index.html"> <img src="../images/logo X Group.png" alt="Logo de la pagina"> </a>
            <a class="titulologo" href="../index.html">
                <h1>X Group Education</h1>
            </a>
        </div>
        <div class="search-cursos">
            <input list="cursos" id="traveling-web" name="traveling-web">
            <datalist id="cursos">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python">
                <option value="Photoshop">
                <option value="Java">
                <option value="Programacion C">
                <option value="Chat Gpt">
                <option value="Blender Diseño 3d">
                <option value="Canva">
                <option value="Ia: Generacion de prompts">
                <option value="Illustrator">
                <option value="Inteligencia Artificial">
                <option value="Marketing Digital">
            </datalist>
        </div>
        <div class="right-side js-btns-header">
        </div>
    </header>
    <hr class="headerline">
    <nav>
        <ul class="nav-links js-nav">
        </ul>
    </nav>
    <hr class="headerline">

    <main>
        <div class="sidebar-carrito">
        </div>
        <section class="forms">
            <div class="forms-inner">
                <div class="forms-header">
                    <h2>Curso Blender: Diseño 3D</h2>
                    <h3>Inscripción</h3>
                </div>
            </div>
            <form action="anotar" method="get">
                <label for="nombre1">Nombre</label>
                <input type="text" name="nombre1" id="nombre1" placeholder="Nombre" required>
                </label>
                <label for="apellido1">Apellido
                    <input type="text" name="apellido" id="apellido1" placeholder="Apellido" required>
                </label>
                <label for="dni1">DNI
                    <input type="number" name="DNI" id="dni1" placeholder="DNI">
                </label>
                <div class="forms-add">
                    <label for="horario">Horario:
                        <select name="horario" id="horario">
                            <option value="" disabled selected>Selecciona un horario</option>
                            <option value="Mañana">Mañana 8-12hs</option>
                            <option value="Tarde">Tarde 14-18hs</option>
                            <option value="Noche">Noche 19-23hs</option>
                        </select>
                    </label>
                </div>

                <div class="forms-enrollment-amount">
                    <h3 id="total_a_abonar">$000.-</h3>
                </div>
                <button type="submit" class="inscription">Inscripción</button>
            </form>

            <dialog>
                <h2> ~ Muchas gracias ~ </h2>
                <h3 class="contenedor_empresa_dialog"></h3>
                <h3>El link de pago sera enviado por email</h3>
                <button id="js-CloseDialog">Cerrar</button>
            </dialog>
        </section>
    </main>

    <footer class="footer js-footer"></footer>


    <script src="../js/formulario.js" type="module"></script>
</body>

</html>
